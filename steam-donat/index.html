<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пополнение Steam-кошелька</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Пополнение Steam‑кошелька</h1>
        <button id="theme-toggle" aria-label="Переключить тему">🌙</button>
    </header>
    
    <main>
        <form id="topup-form">
            <div class="form-group">
                <label for="amount">Сумма пополнения (руб):</label>
                <input type="number" id="amount" name="amount" placeholder="100" min="10" required>
            </div>
            
            <div class="form-group">
                <label for="steam-login">Ваш логин Steam:</label>
                <input type="text" id="steam-login" name="steam-login" placeholder="your_steam_login" required>
            </div>
            
            <p>Комиссия: <span id="fee">0</span> руб (<span id="percent">5</span>%)</p>
            <button type="submit">Пополнить</button>
        </form>
    </main>
    
    <footer>
        <nav>
            <a href="about.html">О комиссии</a> | 
            <a href="contacts.html">Контакты</a>
        </nav>
        <p>&copy; 2026 Пополнение Steam</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
